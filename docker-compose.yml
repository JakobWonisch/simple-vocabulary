services:
  vocab:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-nvidia/nemotron-3.5-lightning:free}"
      OPENROUTER_FALLBACK_MODELS: "${OPENROUTER_FALLBACK_MODELS:-}"
      OPENROUTER_PER_MODEL_TIMEOUT_SEC: "${OPENROUTER_PER_MODEL_TIMEOUT_SEC:-25}"
      OPENROUTER_MAX_ATTEMPTS: "${OPENROUTER_MAX_ATTEMPTS:-3}"
      OPENROUTER_SITE_NAME: "${OPENROUTER_SITE_NAME:-simple-vocabulary}"
      OPENROUTER_SITE_URL: "${OPENROUTER_SITE_URL:-}"
    restart: unless-stopped
